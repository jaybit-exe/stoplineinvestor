<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Position Size Calculator Widget | Stopline</title>
<meta name="robots" content="noindex, follow"><link rel="canonical" href="https://stoplineinvestor.org/position-size/">
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#fffaf0;--ink:#14213d;--mut:#5b6478;--line:#14213d;--field:#f7f0df;--track:#e5dcc4;--acc:#e8452c;--red:#c2410c}
.dark{--bg:#151e38;--ink:#f2ead8;--mut:#a9b2c9;--line:#e9e1cd;--field:#0f1830;--track:#243152;--acc:#ff6b4a;--red:#ff8a65}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{padding:12px 14px;max-width:460px;margin:0 auto}
h1{font-size:17px;margin:0 0 10px;font-weight:800}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:3px}
input{width:100%;padding:8px 9px;border:2px solid var(--track);border-radius:8px;background:var(--field);color:var(--ink);font:600 15px/1.2 ui-monospace,Menlo,Consolas,monospace}
input:focus{outline:none;border-color:var(--acc)}
.out{margin-top:12px;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.big{display:flex;align-items:baseline;gap:8px}.big b{font-size:30px;font-family:ui-monospace,Menlo,Consolas,monospace}.big span{color:var(--mut);font-weight:700}
.dir{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.st{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px}
.st div{font-size:12px;color:var(--mut);font-weight:700}.st div b{display:block;color:var(--ink);font:600 15px ui-monospace,Menlo,Consolas,monospace}
.ft{margin-top:10px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ft a{color:var(--acc);font-weight:800;text-decoration:none}.ft a:hover{text-decoration:underline}
.warn{color:var(--red)}
</style></head>
<body><div class="w">
<h1>Position size calculator</h1>
<div class="g">
<div><label for="a">Account size ($)</label><input id="a" type="number" inputmode="decimal" value="10000" step="any"></div>
<div><label for="r">Risk per trade (%)</label><input id="r" type="number" inputmode="decimal" value="1" step="any"></div>
<div><label for="e">Entry price</label><input id="e" type="number" inputmode="decimal" value="50" step="any"></div>
<div><label for="s">Stop-loss price</label><input id="s" type="number" inputmode="decimal" value="48" step="any"></div>
<div><label for="m">Multiplier ($ per point)</label><input id="m" type="number" inputmode="decimal" value="1" step="any"></div>
<div><label for="t">Target price (optional)</label><input id="t" type="number" inputmode="decimal" value="" step="any"></div>
</div>
<div class="out" aria-live="polite">
<div class="dir" id="dir">Long position size</div>
<div class="big"><b id="size">-</b><span id="unit">shares</span></div>
<div class="st"><div>Max loss<b id="loss">-</b></div><div>Position value<b id="val">-</b></div><div>Reward to risk<b id="rr">-</b></div><div>Potential gain<b id="gain">-</b></div></div>
</div>
<div class="ft"><span>Educational only, not financial advice.</span><a href="https://stoplineinvestor.org/position-size/?utm_source=embed" target="_blank" rel="noopener">Powered by Stopline</a></div>
</div>
<script>
(function(){
var q=new URLSearchParams(location.search);if(q.get('theme')==='dark')document.documentElement.className='dark';
['a','r','e','s','m','t'].forEach(function(k){var v=q.get(k);if(v!==null&&v!==''&&isFinite(+v))document.getElementById(k).value=v});
var $=function(i){return document.getElementById(i)};
var usd=function(n){return n.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2})};
function calc(){
var a=+$('a').value,r=+$('r').value,e=+$('e').value,s=+$('s').value,m=+$('m').value||1,t=+$('t').value;
$('unit').textContent=m===1?'shares':'contracts';
if(!(a>0&&r>0&&e>0&&s>0&&e!==s&&m>0)){$('dir').textContent='Enter your entry and stop';$('size').textContent='-';['loss','val','rr','gain'].forEach(function(i){$(i).textContent='-'});return}
var long=s<e,per=Math.abs(e-s)*m,size=Math.floor(a*r/100/per+1e-9),tOk=t>0&&(long?t>e:t<e);
$('dir').textContent=(long?'Long':'Short')+' position size';
$('size').textContent=size.toLocaleString('en-US');$('size').className=size<1?'warn':'';if(size<1)$('dir').textContent='Risk is smaller than one '+(m===1?'share':'contract');
$('loss').textContent=usd(size*per);$('val').textContent=usd(size*e*m);
$('rr').textContent=tOk?(Math.abs(t-e)/Math.abs(e-s)).toFixed(2)+' : 1':'-';
$('gain').textContent=tOk?usd(size*Math.abs(t-e)*m):'-';
}
['a','r','e','s','m','t'].forEach(function(k){$(k).addEventListener('input',calc)});calc();
})();
</script>
</body></html>
